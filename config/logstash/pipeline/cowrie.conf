# Logstash pipeline — Cowrie JSON → Elasticsearch
# Part of ELK Stack for real-time honeypot log search & visualization

input {
  file {
    path => ["/cowrie/logs/cowrie.json"]
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "cowrie"
  }
}

filter {
  if [type] == "cowrie" {
    mutate {
      rename => { "src_ip" => "attacker_ip" }
      rename => { "dst_port" => "honeypot_port" }
      add_field => { "[@metadata][index]" => "cowrie-%{+YYYY.MM.dd}" }
      add_tag => ["honeypot", "cowrie", "honeynet"]
    }

    # Enrich event class for Kibana dashboards
    if [eventid] == "cowrie.login.failed" {
      mutate { add_field => { "attack_stage" => "authentication_failure" } }
    } else if [eventid] == "cowrie.login.success" {
      mutate { add_field => { "attack_stage" => "authentication_success" } }
    } else if [eventid] == "cowrie.command.input" {
      mutate { add_field => { "attack_stage" => "interactive_shell" } }
    } else if [eventid] == "cowrie.session.file_download" {
      mutate { add_field => { "attack_stage" => "payload_download" } }
    } else if [eventid] =~ /^cowrie\.session/ {
      mutate { add_field => { "attack_stage" => "session" } }
    }

    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "%{[@metadata][index]}"
  }
  stdout { codec => rubydebug }
}
