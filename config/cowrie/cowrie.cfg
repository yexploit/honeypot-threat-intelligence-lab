# Cowrie honeypot configuration — Honeypot Threat Intelligence Lab
# Aligned with The Honeynet Project practices (controlled deception, rich logging)

[honeypot]
hostname = web-prod-01
# Fake enterprise banner to attract opportunistic scanners
sensor_name = honeypot-lab-01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog = true
download_limit_size = 10485760

[ssh]
enabled = true
# Listen inside container (mapped via docker-compose)
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5
# Accept common weak credentials so sessions proceed for command capture
auth_class = UserDB
auth_none_enabled = false

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log

[shell]
filesystem = share/cowrie/fs.pickle
processes = share/cowrie/cmdoutput.json
arch = linux-x64-lsb
kernel_version = 5.4.0-150-generic
kernel_build_string = #167-Ubuntu SMP Mon May 15 17:35:05 UTC 2023

[output_elasticsearch]
enabled = false
# Use Logstash file input instead (more reliable across platforms)
